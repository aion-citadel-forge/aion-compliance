<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Savana Meadow" />
  <title>Savana's Equestrian Meadow</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1b14;
      color: #f4f1ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 360px;
      width: 100%;
      background: #14281e;
      border: 1px solid #e5b26355;
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
    }
    h1 {
      font-size: 1.25rem;
      color: #e5b263;
      margin: 0 0 10px;
    }
    p {
      font-size: 0.95rem;
      color: #cfe0d6;
      margin: 0 0 18px;
      line-height: 1.45;
    }
    a.btn {
      display: inline-block;
      background: #e5b263;
      color: #0d1b14;
      font-weight: 700;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Savana's Equestrian Meadow</h1>
    <p id="status">Connecting to your sanctuary...</p>
    <a id="openBtn" class="btn" href="#">Open Meadow</a>
  </div>
  <script>
    (async () => {
      const statusEl = document.getElementById("status");
      const btn = document.getElementById("openBtn");
      try {
        const res = await fetch(
          "https://raw.githubusercontent.com/aion-citadel-forge/aion-compliance/citadel-beacon/family_tunnel.json?t=" + Date.now(),
          { cache: "no-store" }
        );
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const base = (data.url || "").replace(/\/+$/, "");
        if (!base) throw new Error("No active tunnel URL");
        const target = base + "/savana";
        btn.href = target;
        btn.style.display = "inline-block";
        statusEl.textContent = "Redirecting you now...";
        window.location.replace(target);
      } catch (err) {
        statusEl.textContent = "Could not reach the live beacon right now (" + err.message + "). Please try again in a moment.";
      }
    })();
  </script>
</body>
</html>
