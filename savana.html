<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Savana Meadow" />
  <title>Savana Equestrian Meadow</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #14100d; color: #f3e6d3; font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 24px; }
    .card { max-width: 360px; }
    h2 { color: #e5b263; margin-bottom: 8px; }
    p { color: #c7b8a3; font-size: 14px; line-height: 1.5; }
    button { margin-top: 16px; padding: 10px 20px; border-radius: 10px; border: 1px solid #e5b263; background: #3d251a; color: #e5b263; font-weight: 600; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Savana's Sanctuary</h2>
    <p id="msg">Connecting to live Tower server…</p>
    <button id="retry" style="display:none" onclick="connectNow()">Retry Connection</button>
  </div>
  <script>
    const BEACON = "https://raw.githubusercontent.com/aion-citadel-forge/aion-compliance/citadel-beacon/family_tunnel.json";
    async function connectNow() {
      const msg = document.getElementById("msg");
      const btn = document.getElementById("retry");
      btn.style.display = "none";
      msg.textContent = "Connecting to live Tower server…";
      try {
        const res = await fetch(BEACON + "?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("Beacon HTTP " + res.status);
        const data = await res.json();
        const base = String(data.url || data.tunnel_url || "").replace(/\/+$/, "");
        if (!base.startsWith("https://")) throw new Error("Invalid tunnel URL");
        window.location.replace(base + "/savana");
      } catch (e) {
        msg.textContent = "Could not reach server (" + e.message + "). Tap Retry in a moment.";
        btn.style.display = "inline-block";
      }
    }
    connectNow();
  </script>
</body>
</html>
